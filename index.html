<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recreation Arts and Crafts — Paper Art Portfolio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;700&display=swap');

:root{
  --deep:#9B2D51;
  --deep2:#7E2340;
  --mid:#E8A0BF;
  --mid2:#F3C9DA;
  --light:#FFF4F8;
  --text:#5C1F35;
  --white:#FFFFFF;
  --gold:#C98A9C;
  --desk:#5c3a45;
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; height:100%;
  background:
    radial-gradient(ellipse at 30% 20%, #7a4a58 0%, transparent 55%),
    radial-gradient(ellipse at 80% 80%, #6b3f4d 0%, transparent 55%),
    var(--desk);
  font-family:'EB Garamond', Georgia, serif;
  color:var(--text);
  overflow:hidden;
}
.stage{
  width:100vw; height:100vh;
  display:flex; align-items:center; justify-content:center;
  perspective:2600px;
  position:relative;
}

/* ---------- decorative desk texture ---------- */
.confetti{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.confetti span{position:absolute; font-size:22px; opacity:.16; color:#ffd7e6; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));}

/* ---------- book ---------- */
.book{
  position:relative;
  width:min(92vw, 1080px);
  aspect-ratio: 1080 / 660;
  display:flex;
  filter: drop-shadow(0 30px 45px rgba(0,0,0,.45));
}
.cover-mode .book{ width:min(60vw, 560px); aspect-ratio: 540/660; }

@media (max-width:760px){
  .book{ width:95vw; aspect-ratio: 1080 / 1500; }
  .cover-mode .book{ width:min(88vw, 420px); aspect-ratio: 540 / 900; }
}

.page{
  position:relative;
  width:50%; height:100%;
  background: var(--light);
  overflow:hidden;
  background-image:
    linear-gradient(90deg, rgba(0,0,0,.05), transparent 3%),
    repeating-linear-gradient( to bottom, transparent 0 38px, rgba(155,45,81,.05) 38px 39px );
}
.page.left{ border-radius:14px 0 0 14px; box-shadow: inset -10px 0 22px -14px rgba(0,0,0,.35);}
.page.right{ border-radius:0 14px 14px 0; box-shadow: inset 10px 0 22px -14px rgba(0,0,0,.35);}
.cover-mode .page.left{ display:none; }
.cover-mode .page.right{ width:100%; border-radius:14px;}

.spine{
  position:absolute; left:50%; top:0; bottom:0; width:26px; margin-left:-13px;
  background:linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,.05) 30%, rgba(0,0,0,.05) 70%, rgba(0,0,0,.28));
  z-index:5; pointer-events:none;
}
.cover-mode .spine{ display:none; }

.spiral{
  position:absolute; left:50%; top:0; bottom:0; width:34px; margin-left:-17px;
  z-index:6; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
}
.cover-mode .spiral{ display:none; }
.spiral i{
  width:16px; height:16px; border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #fff, #cfd3d6 55%, #9aa0a6 100%);
  box-shadow: 0 1px 2px rgba(0,0,0,.5) inset, 0 1px 1px rgba(0,0,0,.3);
}

.flap{
  position:absolute; top:0; height:100%; width:50%;
  transform-style:preserve-3d;
  z-index:20;
  pointer-events:none;
  display:none;
}
.flap.active{ display:block; }
.flap.right-flap{ left:50%; transform-origin:left center; }
.flap.left-flap{ left:0; transform-origin:right center; }
.flap .face{
  position:absolute; inset:0; backface-visibility:hidden; overflow:hidden;
  background:var(--light);
}
.flap .face.front{ }
.flap .face.back{ transform: rotateY(180deg); }
.flap.right-flap .face.front{ border-radius:0 14px 14px 0; }
.flap.right-flap .face.back{ border-radius:14px 0 0 14px; }
.flap.left-flap .face.front{ border-radius:14px 0 0 14px; }
.flap.left-flap .face.back{ border-radius:0 14px 14px 0; }
.flap .shade{
  position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,.28), transparent 40%);
  opacity:0; transition:opacity .35s;
}
.flap.flipping .shade{ opacity:1; }

/* ---------- page inner padding wrapper ---------- */
.pad{ position:absolute; inset:0; padding:34px 30px; display:flex; flex-direction:column; min-height:0; }

/* ---------- generic bits ---------- */
.eyebrow{
  font-family:'EB Garamond', serif; font-size:11px; letter-spacing:3px; font-weight:600;
  color:var(--gold); text-transform:uppercase; margin:0 0 4px;
}
h1.pg-title, h2.pg-title{
  font-family:'Playfair Display', serif; color:var(--deep); margin:0 0 10px; line-height:1.15;
}
.folio{
  position:absolute; bottom:14px; font-size:11px; color:var(--gold); font-style:italic;
}
.folio.l{ left:24px; } .folio.r{ right:24px; }

.heart, .bow, .flower{ color:var(--mid); }

/* ---------- COVER ---------- */
.cover-page{
  background:
    radial-gradient(circle at 15% 12%, rgba(255,255,255,.5), transparent 40%),
    linear-gradient(160deg, var(--deep) 0%, var(--deep2) 100%);
  color:var(--white); display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; height:100%; position:relative; border-radius:14px;
}
.cover-page .ribbon{
  position:absolute; top:0; left:0; right:0; height:10px;
  background:repeating-linear-gradient(45deg, var(--mid2), var(--mid2) 10px, transparent 10px, transparent 20px);
  opacity:.6;
}
.cover-bow{ font-size:52px; margin-bottom:6px; }
.cover-page h1{
  font-family:'Playfair Display', serif; font-weight:700; font-size:clamp(22px,3.4vw,34px);
  margin:6px 0 4px; letter-spacing:.5px; text-shadow:0 2px 10px rgba(0,0,0,.25);
}
.cover-page .sub{
  font-family:'Playfair Display', serif; font-style:italic; font-weight:500; color:var(--mid2);
  font-size:clamp(13px,1.6vw,18px); margin-bottom:26px;
}
.cover-card{
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.35); backdrop-filter:blur(2px);
  border-radius:14px; padding:18px 26px; max-width:78%;
}
.cover-card .lbl{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--mid2); margin:10px 0 2px;}
.cover-card .name{ font-family:'Playfair Display',serif; font-weight:700; font-size:16px; }
.cover-card .meta{ font-size:12px; font-style:italic; color:#f6dbe6; margin-top:2px;}
.cover-hint{
  position:absolute; bottom:16px; font-size:12px; color:var(--mid2); font-style:italic;
}

/* ---------- QUOTE ---------- */
.quote-page{
  background:linear-gradient(160deg, var(--deep) 0%, var(--deep2) 100%); color:var(--white);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%;
}
.quote-page .qmark{ font-size:56px; color:var(--mid2); font-family:'Playfair Display',serif; line-height:1;}
.quote-page p{
  font-family:'Playfair Display', serif; font-style:italic; font-weight:600; font-size:clamp(15px,2vw,21px);
  max-width:82%; line-height:1.5; margin:10px 0 22px;
}
.quote-page .div{ width:70px; height:2px; background:var(--mid2); margin-bottom:14px;}

/* ---------- DIVIDER ---------- */
.divider-page{
  background:linear-gradient(160deg, var(--deep) 0%, var(--deep2) 100%); color:var(--white);
  display:flex; align-items:center; justify-content:center; height:100%; padding:24px;
}
.divider-inner{
  border:1.5px dashed rgba(255,255,255,.55); border-radius:14px; width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18px;
}
.divider-inner .bow{ font-size:34px; margin-bottom:10px; }
.divider-inner h2{
  font-family:'Playfair Display',serif; font-weight:700; font-size:clamp(17px,2.4vw,25px); margin:0 0 8px; letter-spacing:.5px;
}
.divider-inner .sub{ font-family:'Playfair Display',serif; font-style:italic; color:var(--mid2); font-size:13px; }

/* ---------- TOC ---------- */
.toc-page{ height:100%; }
.toc-head{
  background:var(--deep); color:var(--white); border-radius:10px; padding:10px 16px; display:flex; align-items:center; gap:10px;
  font-family:'Playfair Display',serif; font-weight:700; font-size:17px; margin-bottom:10px;
}
.toc-list{ overflow-y:auto; flex:1; min-height:0; padding-right:2px; }
.toc-row{
  display:flex; align-items:baseline; gap:8px; padding:5px 8px; font-size:11.5px; border-radius:6px;
}
.toc-row:nth-child(odd){ background:rgba(255,255,255,.65); }
.toc-row b{ color:var(--deep); width:16px; flex:none; font-family:'Playfair Display',serif;}
.toc-row .t{ flex:1; }
.toc-row .n{ color:var(--gold); font-style:italic; font-family:'Playfair Display',serif; }

/* ---------- COLLAGE GRID ---------- */
.collage-page{ height:100%; }
.collage-label{
  background:var(--mid); color:var(--white); text-align:center; border-radius:8px; padding:7px; font-size:12.5px; font-weight:600;
  margin-bottom:10px; font-family:'EB Garamond', serif; letter-spacing:.3px;
}
.grid2x2{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:10px; flex:1; min-height:0; }
.polaroid{
  background:var(--white); border-radius:10px; box-shadow:0 4px 10px rgba(155,45,81,.18); padding:6px 6px 20px;
  display:flex; flex-direction:column; position:relative; min-height:0;
}
.polaroid .tape{
  position:absolute; top:-8px; left:50%; margin-left:-22px; width:44px; height:14px;
  background:rgba(232,160,191,.7); transform:rotate(-4deg); border-radius:2px;
}
.polaroid .ph{
  flex:1; min-height:0; border-radius:6px; overflow:hidden; background:#FBE4EC; display:flex; align-items:center; justify-content:center;
}
.polaroid .ph img{ width:100%; height:100%; object-fit:cover; }
.polaroid .cap{ font-size:9px; text-align:center; font-style:italic; margin-top:4px; color:var(--text); }

/* ---------- LESSON PLAN ---------- */
.lesson-page{ height:100%; }
.lp-card{ background:var(--white); border-radius:12px; box-shadow:0 4px 12px rgba(155,45,81,.15); padding:16px 18px; flex:1; min-height:0; overflow-y:auto;}
.lp-tag{
  display:inline-block; background:var(--mid2); color:var(--deep); font-size:10.5px; font-weight:700;
  padding:4px 10px; border-radius:7px; margin-bottom:10px; letter-spacing:.5px;
}
.lp-field h4{ margin:10px 0 3px; color:var(--deep); font-family:'Playfair Display',serif; font-size:12.5px; }
.lp-field p, .lp-field li{ margin:0 0 3px; font-size:10.5px; line-height:1.42; color:var(--text); }
.lp-field ul{ margin:0; padding-left:14px; }

/* ---------- ARTWORK PHOTO PAGE ---------- */
.art-page{ height:100%; }
.art-frame{
  flex:1; min-height:0; background:var(--white); border-radius:12px; box-shadow:0 4px 12px rgba(155,45,81,.15);
  padding:10px; display:flex; flex-direction:column; position:relative;
}
.art-frame .tape{ position:absolute; top:-9px; left:50%; margin-left:-24px; width:48px; height:15px; background:rgba(232,160,191,.75); transform:rotate(-3deg); border-radius:2px;}
.art-frame .ph{ flex:1; min-height:0; border-radius:8px; overflow:hidden; background:#FBE4EC; }
.art-frame .ph img{ width:100%; height:100%; object-fit:cover; }
.art-frame .cap{ text-align:center; font-style:italic; font-size:11px; margin-top:8px; color:var(--text); }

/* ---------- BACK COVER ---------- */
.back-page{
  background:linear-gradient(160deg, var(--deep) 0%, var(--deep2) 100%); color:var(--white);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%; gap:10px;
}
.back-page .msg{ font-family:'Playfair Display',serif; font-style:italic; font-size:16px; max-width:75%; }
.back-page .sign{ font-family:'Caveat', cursive; font-size:26px; color:var(--mid2); margin-top:6px; }


/* ---------- SCREENSHOT / INSIGHT PAGES ---------- */
.shot-page{ height:100%; }
.shot-frame{ background:var(--white); border-radius:12px; box-shadow:0 4px 12px rgba(155,45,81,.15); padding:8px; position:relative; flex:none; }
.shot-frame .tape{ position:absolute; top:-9px; left:50%; margin-left:-24px; width:48px; height:15px; background:rgba(232,160,191,.75); transform:rotate(-3deg); border-radius:2px;}
.shot-frame img{ width:100%; display:block; border-radius:6px; aspect-ratio:16/9; object-fit:cover; }
.shot-frame .cap{ text-align:center; font-style:italic; font-size:10.5px; margin-top:6px; color:var(--text); }
.insight{ margin-top:12px; background:var(--white); border-left:4px solid var(--mid); border-radius:10px; padding:10px 14px; box-shadow:0 3px 8px rgba(155,45,81,.12); overflow-y:auto; min-height:0; flex:1; }
.insight h4{ margin:0 0 4px; font-family:'Playfair Display',serif; font-size:12.5px; color:var(--deep); }
.insight p{ margin:0; font-size:11.5px; line-height:1.5; }
.text-card{ background:var(--white); border-radius:12px; box-shadow:0 4px 12px rgba(155,45,81,.15); padding:14px 16px; flex:1; min-height:0; overflow-y:auto; }
.text-card .it{ margin-bottom:10px; padding-left:12px; border-left:3px solid var(--mid); }
.text-card .it h4{ margin:0 0 2px; font-family:'Playfair Display',serif; font-size:12px; color:var(--deep); }
.text-card .it p{ margin:0; font-size:11px; line-height:1.48; }
.link-card{ background:var(--white); border-radius:12px; box-shadow:0 4px 12px rgba(155,45,81,.15); padding:22px 20px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; }
.link-card .big{ font-size:38px; }
.link-card p{ margin:0; font-size:12.5px; line-height:1.5; }
.assign-link{ display:inline-block; background:var(--deep); color:var(--white)!important; text-decoration:none; padding:10px 20px; border-radius:30px; font-weight:600; font-size:13px; letter-spacing:.3px; box-shadow:0 4px 10px rgba(155,45,81,.3); cursor:pointer; }
.assign-link:hover{ background:var(--deep2); }
.url{ font-size:9.5px; word-break:break-all; color:var(--gold); max-width:90%; }
.url a{ color:var(--deep); }
.back-page .assign-link{ background:var(--mid2); color:var(--deep2)!important; margin-top:8px; }
.back-page .url a{ color:var(--mid2); }
.back-page .url{ color:var(--mid2); }

/* ---------- CONTROLS ---------- */
.nav-btn{
  position:absolute; top:50%; transform:translateY(-50%);
  width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(255,255,255,.9); color:var(--deep); font-size:20px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(0,0,0,.35);
  transition:transform .15s, background .15s; z-index:40;
}
.nav-btn:hover{ background:var(--white); transform:translateY(-50%) scale(1.08); }
.nav-btn:disabled{ opacity:.25; cursor:default; }
.nav-btn:disabled:hover{ transform:translateY(-50%) scale(1); }
.nav-btn.prev{ left:calc(50% - min(46vw, 550px) - 66px); }
.nav-btn.next{ right:calc(50% - min(46vw, 550px) - 66px); }

.dots{
  position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
  display:flex; gap:7px; z-index:40;
}
.dots span{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35); transition:.2s; cursor:pointer; }
.dots span.active{ background:var(--mid2); transform:scale(1.3); }

.hint{
  position:absolute; top:22px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.75); font-size:12px; font-style:italic; letter-spacing:.3px; z-index:40;
  font-family:'EB Garamond', serif;
}

@media (max-width:760px){
  .nav-btn{ width:40px; height:40px; font-size:16px; }
  .nav-btn.prev{ left:6px; }
  .nav-btn.next{ right:6px; }
  .hint{ display:none; }
  .pad{ padding:20px 16px; }
  .cover-page h1{ font-size:19px; }
  .cover-card{ padding:14px 16px; max-width:88%; }
  .cover-card .name{ font-size:14px; }
  .toc-row{ font-size:10px; }
  .lp-field p, .lp-field li{ font-size:10px; }
  .grid2x2{ gap:6px; }
  .polaroid{ padding:4px 4px 16px; }
  .polaroid .cap{ font-size:8px; }
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="confetti" id="confetti"></div>
  <div class="hint">click a page edge or use the arrows to turn the page</div>

  <button class="nav-btn prev" id="prevBtn" aria-label="Previous page">&#10094;</button>

  <div class="book" id="book">
    <div class="page left" id="leftPage"></div>
    <div class="spiral" id="spiral"></div>
    <div class="spine"></div>
    <div class="page right" id="rightPage"></div>

    <div class="flap right-flap" id="flapRight">
      <div class="face front" id="flapRightFront"></div>
      <div class="face back" id="flapRightBack"></div>
      <div class="shade"></div>
    </div>
    <div class="flap left-flap" id="flapLeft">
      <div class="face front" id="flapLeftFront"></div>
      <div class="face back" id="flapLeftBack"></div>
      <div class="shade"></div>
    </div>
  </div>

  <button class="nav-btn next" id="nextBtn" aria-label="Next page">&#10095;</button>
  <div class="dots" id="dots"></div>
</div>

        ["Song","Music lifts the mood and builds a sense of belonging, which is a strong start for any lesson."],
        ["Game","Interactive games keep learners engaged and let them show what they know without the pressure of a formal test."],
        ["Reporting","Clear, well-organized reporting helps everyone understand a topic and spark meaningful discussion."],
        ["Overall","Together, these activities showed me that inclusive teaching is joyful, active, and open to every learner."]
      ],"22","l"),
    right: linkHTML("23") },
  { cover:true, right: backHTML() },
];

/* ============================================================
   BOOK ENGINE
   ============================================================ */
let current = 0;
let animating = false;

const stage = document.getElementById('stage');
const book = document.getElementById('book');
const leftPage = document.getElementById('leftPage');
const rightPage = document.getElementById('rightPage');
const flapR = document.getElementById('flapRight');
const flapRFront = document.getElementById('flapRightFront');
const flapRBack = document.getElementById('flapRightBack');
const flapL = document.getElementById('flapLeft');
const flapLFront = document.getElementById('flapLeftFront');
const flapLBack = document.getElementById('flapLeftBack');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dotsEl = document.getElementById('dots');
const spiral = document.getElementById('spiral');

for(let i=0;i<14;i++){ const s=document.createElement('i'); spiral.appendChild(s); }

spreads.forEach((_,i)=>{
  const d = document.createElement('span');
  d.addEventListener('click', ()=>goTo(i));
  dotsEl.appendChild(d);
});

function renderStatic(){
  const sp = spreads[current];
  stage.classList.toggle('cover-mode', !!sp.cover);
  leftPage.innerHTML = sp.left || '';
  rightPage.innerHTML = sp.right || '';
  prevBtn.disabled = current===0;
  nextBtn.disabled = current===spreads.length-1;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active', i===current));
}

function goTo(idx){
  if(animating || idx===current) return;
  if(idx>current){ for(let i=current;i<idx;i++) goNext(true); }
  else { for(let i=current;i>idx;i--) goPrev(true); }
}

function goNext(skipAnim){
  if(animating || current>=spreads.length-1) return;
  const cur = spreads[current];
  const nxt = spreads[current+1];

  if(skipAnim){ current++; renderStatic(); return; }
  if(cur.cover){ // cover flips as a full-width page
    animating = true;
    stage.classList.add('cover-mode');
    flapR.style.left = '0'; flapR.style.width='100%';
    flapRFront.innerHTML = cur.right || '';
    flapRBack.innerHTML = nxt.left || '';
    flapRFront.style.borderRadius = '14px';
    flapRBack.style.borderRadius = '14px';
    rightPage.innerHTML = ''; leftPage.innerHTML='';
    flapR.classList.add('active');
    requestAnimationFrame(()=>{
      flapR.classList.add('flipping');
      flapR.style.transform = 'rotateY(-180deg)';
    });
    flapR.addEventListener('transitionend', function done(){
      flapR.removeEventListener('transitionend', done);
      flapR.classList.remove('active','flipping');
      flapR.style.transform='';
      flapR.style.left=''; flapR.style.width='';
      flapRFront.style.borderRadius=''; flapRBack.style.borderRadius='';
      current++;
      renderStatic();
      animating=false;
    }, {once:true});
    return;
  }

  animating = true;
  rightPage.innerHTML = nxt.right || '';
  flapRFront.innerHTML = cur.right || '';
  flapRBack.innerHTML = nxt.left || '';
  flapR.classList.add('active');
  requestAnimationFrame(()=>{
    flapR.classList.add('flipping');
    flapR.style.transform = 'rotateY(-180deg)';
  });
  flapR.addEventListener('transitionend', function done(){
    flapR.removeEventListener('transitionend', done);
    flapR.classList.remove('active','flipping');
    flapR.style.transform='';
    leftPage.innerHTML = nxt.left || '';
    current++;
    renderStatic();
    animating=false;
  }, {once:true});
}

function goPrev(skipAnim){
  if(animating || current<=0) return;
  const cur = spreads[current];
  const prv = spreads[current-1];

  if(skipAnim){ current--; renderStatic(); return; }

  if(cur.cover){ // back cover -> previous spread
    animating = true;
    stage.classList.remove('cover-mode');
    // Treat as full spread flap on right side coming back
    rightPage.innerHTML = prv.right || '';
    leftPage.innerHTML = prv.left || '';
    flapRFront.innerHTML = cur.right || '';
    flapRBack.innerHTML = prv.left || '';
    flapR.style.left = '50%'; flapR.style.width='50%';
    flapR.classList.add('active');
    flapR.style.transform = 'rotateY(-180deg)';
    requestAnimationFrame(()=>{
      flapR.classList.add('flipping');
      flapR.style.transform = 'rotateY(0deg)';
    });
    flapR.addEventListener('transitionend', function done(){
      flapR.removeEventListener('transitionend', done);
      flapR.classList.remove('active','flipping');
      flapR.style.transform='';
      flapR.style.left=''; flapR.style.width='';
      current--;
      renderStatic();
      animating=false;
    }, {once:true});
    return;
  }

  if(prv.cover){
    animating = true;
    stage.classList.remove('cover-mode');
    flapR.style.left='0'; flapR.style.width='100%';
    flapRFront.innerHTML = leftPage.innerHTML || cur.left || '';
    flapRBack.innerHTML = prv.right || '';
    flapRFront.style.borderRadius='14px'; flapRBack.style.borderRadius='14px';
    leftPage.innerHTML=''; rightPage.innerHTML='';
    flapR.classList.add('active');
    flapR.style.transform = 'rotateY(-180deg)';
    requestAnimationFrame(()=>{
      flapR.classList.add('flipping');
      flapR.style.transform = 'rotateY(0deg)';
    });
    flapR.addEventListener('transitionend', function done(){
      flapR.removeEventListener('transitionend', done);
      flapR.classList.remove('active','flipping');
      flapR.style.transform='';
      flapR.style.left=''; flapR.style.width='';
      flapRFront.style.borderRadius=''; flapRBack.style.borderRadius='';
      current--;
      renderStatic();
      animating=false;
    }, {once:true});
    return;
  }

  animating = true;
  leftPage.innerHTML = prv.left || '';
  flapLFront.innerHTML = cur.left || '';
  flapLBack.innerHTML = prv.right || '';
  flapL.classList.add('active');
  flapL.style.transform = 'rotateY(0deg)';
  requestAnimationFrame(()=>{
    flapL.classList.add('flipping');
    flapL.style.transform = 'rotateY(180deg)';
  });
  flapL.addEventListener('transitionend', function done(){
    flapL.removeEventListener('transitionend', done);
    flapL.classList.remove('active','flipping');
    flapL.style.transform='';
    rightPage.innerHTML = prv.right || '';
    current--;
    renderStatic();
    animating=false;
  }, {once:true});
}

document.getElementById('nextBtn').addEventListener('click', ()=>goNext(false));
document.getElementById('prevBtn').addEventListener('click', ()=>goPrev(false));
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goNext(false);
  if(e.key==='ArrowLeft') goPrev(false);
});
leftPage.addEventListener('click', (e)=>{ if(e.target.closest('a') || e.target.closest('.text-card') || e.target.closest('.insight')) return; goPrev(false); });
rightPage.addEventListener('click', (e)=>{
  // avoid triggering when clicking inside scrollable TOC list
  if(e.target.closest('.toc-list') || e.target.closest('.lp-card') || e.target.closest('a') || e.target.closest('.text-card') || e.target.closest('.insight')) return;
  goNext(false);
});

/* flap transitions need explicit CSS transition property (set here to keep style block simpler) */
flapR.style.transition = 'transform .7s cubic-bezier(.4,.1,.2,1)';
flapL.style.transition = 'transform .7s cubic-bezier(.4,.1,.2,1)';

/* confetti hearts on the desk */
(function(){
  const syms = ['♡','✿','🎀','♡','✿'];
  const c = document.getElementById('confetti');
  for(let i=0;i<16;i++){
    const s = document.createElement('span');
    s.textContent = syms[i%syms.length];
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (Math.random()*100)+'vh';
    s.style.fontSize = (14+Math.random()*20)+'px';
    s.style.transform = `rotate(${Math.random()*40-20}deg)`;
    c.appendChild(s);
  }
})();

renderStatic();
</script>
